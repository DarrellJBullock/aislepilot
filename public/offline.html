<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — AislePilot</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #111826;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #fff;
        border-radius: 1.5rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
      }
      .badge {
        width: 56px; height: 56px;
        margin: 0 auto 1rem;
        display: flex; align-items: center; justify-content: center;
        border-radius: 1rem;
        background: #0c9152; color: #fff;
      }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { color: #6b7688; margin: 0 0 1.25rem; font-size: .95rem; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #0c9152; color: #fff; font-weight: 600;
        padding: .75rem 1.25rem; border-radius: .9rem; font-size: .95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h2l2.4 11.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.78L21 8H6" />
          <path d="m11 12 2 2 4-4" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        AislePilot keeps your lists saved on this device, so any pages you've already
        opened still work. Reconnect to sync and load new pages.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
